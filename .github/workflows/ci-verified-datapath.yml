name: Verified Datapath

# Compares the Lean-verified compressor-tree lowering against CIRCT's own
# Datapath dialect on the combinational benchmarks.
#
# Both arms run on the SAME circt-synth binary, built from a CIRCT fork that
# carries the --verified-datapath flag, so the only difference between them is
# the lowering strategy.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      circt_repository:
        description: 'CIRCT repository carrying the --verified-datapath flag'
        required: false
        default: 'cowardsa/circt'
      circt_ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: 'verified-datapath-zext'
      circt_nightly_version:
        description: 'CIRCT artifact supplying LLVM/MLIR and the tools we do not build (circt-verilog, circt-translate, circt-lec). Pinned, not "nightly": the fork is built against this artifact''s MLIR headers, so its LLVM has to match the fork''s own pin. firtool-1.154.0 carries llvm b1c56fb5, which is what verified-datapath-zext pins. Bump this only together with the fork.'
        required: false
        default: 'firtool-1.154.0'
      lean_release:
        description: 'Release tag in the Lean repo holding a prebuilt datapath-cli. Leave empty to build it from source.'
        required: false
        default: ''
      lean_repository:
        description: 'Repository providing datapath-cli'
        required: false
        default: 'opencompl/datapath-verification'
      lean_ref:
        description: 'Ref of the Lean repo to build when no release is given'
        required: false
        default: 'main'
      bitwidths:
        description: 'Comma-separated operand widths'
        required: false
        default: '8,16,32'
      benchmarks:
        description: 'Which comb suites to run'
        required: false
        type: choice
        default: 'DatapathBench'
        options:
          - DatapathBench
          - ELAU
          - microbenchmarks
          - DatapathBench,ELAU
          - all
      equiv_check:
        description: 'Run combinational equivalence checking between the two arms. Off by default: the arms are compared for QoR, and each arm is checked on its own by verify_result.'
        required: false
        type: boolean
        default: false
      verify_result:
        description: 'Verify each arm''s synthesised result and record synthesis + verification time. The Datapath arm is checked against the original Verilog; the verified arm against the Lean snapshot, since its front half is already proved.'
        required: false
        type: boolean
        default: true
      verify_timeout:
        description: 'Per-benchmark verification timeout in seconds. Expect timeouts at 16 and 32 bits; raise this to trade wall clock for coverage.'
        required: false
        default: '300'
      verify_solver:
        description: 'SMT solver command used for verification'
        required: false
        default: 'bitwuzla'
      publish:
        description: 'Publish the report to GitHub Pages'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: verified-datapath-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # setup, build_circt and build_lean have no dependencies on each other, so
  # all three start at once. The two builds are the long poles and now overlap
  # instead of running back to back.
  setup:
    name: Resolve the run configuration
    runs-on: ubuntu-24.04
    outputs:
      bench_paths: ${{ steps.sel.outputs.bench_paths }}
      bench_label: ${{ steps.sel.outputs.bench_label }}
      widths: ${{ steps.sel.outputs.widths }}
      # Single source of truth: build_circt compiles against this artifact's
      # MLIR headers and benchmark takes circt-lec from it. If the two jobs
      # ever installed different versions, circt-synth would be checked by a
      # circt-lec built against a different LLVM.
      circt_version: ${{ inputs.circt_nightly_version || 'firtool-1.154.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the benchmark selection
        id: sel
        env:
          # Null on a scheduled run, which is falsy here, so the cron gets the
          # same suite as the pre-filled dispatch form.
          BENCHMARKS: ${{ inputs.benchmarks }}
          BITWIDTHS: ${{ inputs.bitwidths }}
        run: |
          SEL="${BENCHMARKS:-DatapathBench}"
          if [ "$SEL" = "all" ]; then
            PATHS="benchmarks/comb"
          else
            PATHS=""
            IFS=',' read -ra NAMES <<< "$SEL"
            for NAME in "${NAMES[@]}"; do
              NAME="$(printf '%s' "$NAME" | tr -d '[:space:]')"
              [ -z "$NAME" ] && continue
              # Each comb suite carries its own lit.cfg.py, so a suite
              # directory is a valid standalone lit target. Check for the
              # config rather than the directory: lit exits 0 having run
              # nothing if handed a path it cannot configure, which would
              # publish an empty report.
              if [ ! -f "benchmarks/comb/$NAME/lit.cfg.py" ]; then
                echo "::error::No benchmark suite at benchmarks/comb/$NAME"
                exit 1
              fi
              PATHS="$PATHS benchmarks/comb/$NAME"
            done
          fi
          PATHS="$(printf '%s' "$PATHS" | sed 's/^ *//;s/ *$//')"
          if [ -z "$PATHS" ]; then
            echo "::error::No benchmark suites selected"
            exit 1
          fi
          # The widths become a matrix dimension, so they have to leave this
          # step as a JSON array for fromJSON.
          WIDTHS="$(printf '%s' "${BITWIDTHS:-8,16,32}" | tr -d '[:space:]')"
          JSON="$(printf '%s' "$WIDTHS" | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; printf "]"}')"
          echo "Suites '$SEL' -> $PATHS"
          echo "Widths -> $JSON"
          echo "bench_paths=$PATHS" >> $GITHUB_OUTPUT
          echo "bench_label=$SEL" >> $GITHUB_OUTPUT
          echo "widths=$JSON" >> $GITHUB_OUTPUT

  build_circt:
    name: Build circt-synth
    needs: setup
    runs-on: ubuntu-24.04
    outputs:
      circt_version: ${{ steps.select.outputs.circt_version }}
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native runner packages
        uses: ./.github/actions/setup-ubuntu-ci-tools

      # The prebuilt artifact supplies LLVM/MLIR CMake config plus the tools
      # we do not build ourselves (circt-verilog, circt-translate, circt-lec).
      # It is pinned rather than tracking nightly, because the fork compiles
      # against its MLIR headers: main has since moved to an LLVM that dropped
      # SymbolTable::getSymbolAttrName(), which the fork still calls.
      - name: Install the pinned CIRCT artifact
        uses: circt/install-circt@3f8dda6e1c1965537b5801a43c81c287bac4eae4 # v1.1.1
        with:
          version: ${{ needs.setup.outputs.circt_version }}
          github-token: ${{ github.token }}

      - name: Add CIRCT to PATH
        run: echo "$GITHUB_WORKSPACE/circt/bin" >> $GITHUB_PATH

      # The artifact ships its own copy of the CIRCT headers. Those directories
      # end up on the include path ahead of the fork's, so tablegen reads a
      # pattern from our source but the op definition from the artifact, and
      # fails on any op whose signature changed between the two revisions
      # (e.g. "firrtl.regreset argument number mismatch: 8 vs 9"). Only the
      # LLVM/MLIR halves of the artifact are needed to build against.
      - name: Drop CIRCT headers from the prebuilt artifact
        run: |
          BEFORE=$(find "$GITHUB_WORKSPACE/circt" -type d -path '*/include/circt' | wc -l)
          find "$GITHUB_WORKSPACE/circt" -type d -path '*/include/circt' -prune -exec rm -rf {} +
          echo "Removed $BEFORE stale CIRCT header dir(s) from the artifact."

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Locate LLVM and MLIR CMake directories
        run: |
          MLIR_DIR=$(find "$GITHUB_WORKSPACE/circt" -name 'MLIRConfig.cmake' -printf '%h\n' | head -1)
          LLVM_DIR=$(find "$GITHUB_WORKSPACE/circt" -name 'LLVMConfig.cmake' -printf '%h\n' | head -1)
          if [ -z "$MLIR_DIR" ] || [ -z "$LLVM_DIR" ]; then
            echo "::error::Could not locate LLVM/MLIR CMake config in the CIRCT artifact"
            exit 1
          fi
          echo "MLIR_DIR=$MLIR_DIR" >> $GITHUB_ENV
          echo "LLVM_DIR=$LLVM_DIR" >> $GITHUB_ENV

      - name: Build circt-synth from the verified-datapath fork
        uses: ./.github/actions/build-circt-at-sha
        with:
          repository: ${{ inputs.circt_repository || 'cowardsa/circt' }}
          ref: ${{ inputs.circt_ref || 'verified-datapath-zext' }}
          targets: 'circt-synth'
          checkout_path: circt-src
          build_path: circt-build
          mlir_dir: ${{ env.MLIR_DIR }}
          llvm_dir: ${{ env.LLVM_DIR }}

      - name: Select the built circt-synth
        id: select
        run: |
          SYNTH="$GITHUB_WORKSPACE/circt-build/bin/circt-synth"
          if [ ! -x "$SYNTH" ]; then
            echo "::error::circt-synth was not built at $SYNTH"
            exit 1
          fi
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/circt-build/lib:${LD_LIBRARY_PATH:-}"
          VERSION="$("$SYNTH" --version | tail -1 | xargs)"
          echo "circt_version=$VERSION" >> $GITHUB_OUTPUT
          echo "CIRCT_SYNTH=$SYNTH" >> $GITHUB_ENV

      - name: Verify the fork exposes --verified-datapath
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/circt-build/lib:${LD_LIBRARY_PATH:-}"
          if ! "$CIRCT_SYNTH" --help 2>&1 | grep -q -- '--verified-datapath'; then
            echo "::error::This circt-synth has no --verified-datapath flag."
            echo "Point circt_repository/circt_ref at a branch that carries it."
            exit 1
          fi
          echo "Flag present."

      # The fork is configured with BUILD_SHARED_LIBS=ON, so the binary alone
      # is not runnable: ship circt-build/lib with it. The benchmark jobs
      # unpack this at the same absolute path, which keeps the build tree's
      # RPATH valid; they also set LD_LIBRARY_PATH in case it is not.
      - name: Package circt-synth
        run: |
          tar czf circt-synth.tgz circt-build/bin/circt-synth circt-build/lib
          echo "Packaged $(du -h circt-synth.tgz | cut -f1)"

      - name: Upload circt-synth
        uses: actions/upload-artifact@v4
        with:
          name: circt-synth
          retention-days: 1
          path: circt-synth.tgz

  build_lean:
    name: Build datapath-cli
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4

      - name: Fetch prebuilt datapath-cli
        if: ${{ inputs.lean_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lean-bin
          gh release download "${{ inputs.lean_release }}" \
            --repo "${{ inputs.lean_repository }}" \
            --pattern 'datapath-cli' \
            --dir lean-bin
          chmod +x lean-bin/datapath-cli

      # Cache the whole .lake tree, keyed on the toolchain plus the manifest.
      # A hit makes this step nearly instant; a miss still only downloads
      # Mathlib's prebuilt olean cache rather than compiling it.
      - name: Restore Lean build cache
        if: ${{ inputs.lean_release == '' }}
        uses: actions/cache@v4
        with:
          path: |
            lean-src/.lake
            ~/.elan
          key: lean-${{ runner.os }}-${{ inputs.lean_ref || 'main' }}-${{ github.run_id }}
          restore-keys: |
            lean-${{ runner.os }}-${{ inputs.lean_ref || 'main' }}-
            lean-${{ runner.os }}-

      - name: Build datapath-cli from source
        if: ${{ inputs.lean_release == '' }}
        run: |
          # Restoring the cache creates lean-src/.lake, so lean-src exists with
          # no sources in it. Test for a tracked file, not the directory, and
          # clone into a temporary path so the restored .lake is preserved.
          if [ ! -f lean-src/lean-toolchain ]; then
            git clone --depth=1 \
              --branch "${{ inputs.lean_ref || 'main' }}" \
              "https://github.com/${{ inputs.lean_repository || 'opencompl/datapath-verification' }}.git" \
              lean-src-clone
            mkdir -p lean-src
            # Move sources in alongside whatever the cache restored.
            (cd lean-src-clone && tar cf - .) | (cd lean-src && tar xf -)
            rm -rf lean-src-clone
          fi
          cd lean-src
          if [ ! -f lean-toolchain ]; then
            echo "::error::lean-src has no lean-toolchain; the clone did not land."
            ls -la
            exit 1
          fi
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            # Install the toolchain this project pins. Using --default-toolchain
            # none leaves elan with nothing to run and every lake call fails with
            # "no default toolchain configured"; the repo's lean-toolchain file
            # names the version we actually want.
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          # A restored cache can carry ~/.elan without a default set.
          elan default "$(cat lean-toolchain)"
          elan show
          # Mathlib is by far the bulk of the build. Its prebuilt oleans turn a
          # multi-hour compile into a download, so treat a cache miss as fatal
          # rather than silently starting a build that will hit the job limit.
          if ! lake exe cache get; then
            echo "::error::Could not fetch Mathlib's prebuilt cache. Building it"
            echo "from source takes hours and will exceed the job timeout."
            exit 1
          fi
          lake build datapath-cli
          BIN=$(find .lake/build/bin -name 'datapath-cli' -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::lake build did not produce datapath-cli"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/lean-bin"
          cp "$BIN" "$GITHUB_WORKSPACE/lean-bin/datapath-cli"

      # Lean links the runtime statically, so the bare binary is portable and
      # can be handed to the benchmark jobs as-is.
      - name: Check datapath-cli runs
        run: |
          set -o pipefail
          chmod +x lean-bin/datapath-cli
          ./lean-bin/datapath-cli mul 4 4 4 | head -1
          echo "datapath-cli responds."

      - name: Upload datapath-cli
        uses: actions/upload-artifact@v4
        with:
          name: datapath-cli
          retention-days: 1
          path: lean-bin/datapath-cli

  # One job per (arm, bitwidth). These are what the runtime is actually spent
  # on, and each gets its own runner, so the pool of cores available to lit
  # grows with the matrix instead of being fixed at one machine's core count.
  benchmark:
    name: ${{ matrix.arm }} @ ${{ matrix.bw }}b
    needs: [setup, build_circt, build_lean]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: [datapath, verified]
        bw: ${{ fromJSON(needs.setup.outputs.widths) }}
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native runner packages
        uses: ./.github/actions/setup-ubuntu-ci-tools

      # circt-verilog, circt-translate and circt-lec come from the pinned
      # artifact -- the same one build_circt compiled against -- and only
      # circt-synth is replaced by the fork build below.
      - name: Install the pinned CIRCT artifact
        uses: circt/install-circt@3f8dda6e1c1965537b5801a43c81c287bac4eae4 # v1.1.1
        with:
          version: ${{ needs.setup.outputs.circt_version }}
          github-token: ${{ github.token }}

      - name: Add CIRCT to PATH
        run: echo "$GITHUB_WORKSPACE/circt/bin" >> $GITHUB_PATH

      - name: Download circt-synth
        uses: actions/download-artifact@v4
        with:
          name: circt-synth

      - name: Unpack circt-synth
        run: |
          tar xzf circt-synth.tgz
          SYNTH="$GITHUB_WORKSPACE/circt-build/bin/circt-synth"
          chmod +x "$SYNTH"
          if [ ! -x "$SYNTH" ]; then
            echo "::error::circt-synth missing after unpack"
            exit 1
          fi
          echo "CIRCT_SYNTH=$SYNTH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/circt-build/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Download datapath-cli
        uses: actions/download-artifact@v4
        with:
          name: datapath-cli
          path: lean-bin

      - name: Check the unpacked tools run
        run: |
          set -o pipefail
          chmod +x lean-bin/datapath-cli
          "$CIRCT_SYNTH" --version
          ./lean-bin/datapath-cli mul 4 4 4 | head -1

      - name: Setup tracker
        uses: ./.github/actions/setup-tracker

      - name: Run the benchmarks
        uses: ./.github/actions/run-benchmark
        with:
          synth_tool: circt
          bitwidths: ${{ matrix.bw }}
          benchmark_paths: ${{ needs.setup.outputs.bench_paths }}
          circt_synth_extra_args: ${{ matrix.arm == 'verified' && format('--verified-datapath --verified-datapath-lean-exe={0}/lean-bin/datapath-cli', github.workspace) || '' }}
          output_dir: build_${{ matrix.arm }}
          tool_label: ${{ matrix.arm == 'verified' && 'verified-lean' || 'datapath-dialect' }}
          tool_version: ${{ needs.build_circt.outputs.circt_version }}
          summary_file: summary_${{ matrix.arm }}_${{ matrix.bw }}.json
          verify_result: ${{ inputs.verify_result == null && 'true' || inputs.verify_result }}
          verify_solver: ${{ inputs.verify_solver || 'bitwuzla' }}
          verify_timeout: ${{ inputs.verify_timeout || '300' }}

      # Ship the raw lit output rather than this job's summary, so the report
      # job can run aggregate-results once over the union exactly as the
      # single-job version did. Widths land in separate subdirectories, so
      # unpacking every tarball into one tree merges them without collisions.
      - name: Package results
        if: always()
        run: |
          # This step runs even when the benchmark step died, so the directory
          # may not exist. An empty tarball is fine: the report job checks for
          # missing widths and refuses to publish two empty summaries.
          mkdir -p build_${{ matrix.arm }}
          tar czf results-${{ matrix.arm }}-${{ matrix.bw }}.tgz build_${{ matrix.arm }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.arm }}-${{ matrix.bw }}
          retention-days: 7
          path: results-${{ matrix.arm }}-${{ matrix.bw }}.tgz

  report:
    name: Compare and publish
    needs: [setup, build_circt, benchmark]
    # fail-fast is off, so one arm dying should still produce a report for the
    # rest rather than discarding the whole run's work.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native runner packages
        uses: ./.github/actions/setup-ubuntu-ci-tools

      - name: Setup tracker
        uses: ./.github/actions/setup-tracker

      - name: Download every arm and width
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true

      - name: Unpack results
        run: |
          shopt -s nullglob
          FOUND=0
          for T in results-*.tgz; do
            echo "unpacking $T"
            tar xzf "$T"
            FOUND=1
          done
          if [ "$FOUND" = "0" ]; then
            echo "::error::No benchmark results were produced by any matrix job."
            exit 1
          fi
          find build_datapath build_verified -maxdepth 3 -type d 2>/dev/null | sort

      - name: Aggregate each arm
        env:
          CIRCT_VERSION: ${{ needs.build_circt.outputs.circt_version }}
        run: |
          source .venv/bin/activate
          aggregate-results --tool 'datapath-dialect' --version "$CIRCT_VERSION" \
            --results-dir build_datapath -o summary_datapath.json
          aggregate-results --tool 'verified-lean' --version "$CIRCT_VERSION" \
            --results-dir build_verified -o summary_verified.json

      # A matrix job that died early leaves an empty summary behind. Comparing
      # and publishing that would overwrite a good report with a blank one.
      - name: Check both arms produced results
        env:
          EXPECTED_WIDTHS: ${{ needs.setup.outputs.widths }}
        run: |
          source .venv/bin/activate
          python3 - <<'EOF'
          import json, os, sys
          expected = set(json.loads(os.environ["EXPECTED_WIDTHS"]))
          bad = []
          for f in ("summary_datapath.json", "summary_verified.json"):
              marks = json.load(open(f)).get("benchmarks", {})
              # Summary keys carry the width as a suffix, e.g. MulAddUns_16.
              seen = {}
              for k in marks:
                  seen[k.rsplit("_", 1)[-1]] = seen.get(k.rsplit("_", 1)[-1], 0) + 1
              print(f"{f}: {len(marks)} benchmarks across widths {sorted(seen)}")
              for w in sorted(expected - set(seen)):
                  print(f"::warning::{f} has no results at {w} bits; that job "
                        f"failed or produced nothing, so the report is partial.")
              if not marks:
                  bad.append(f)
          if bad:
              print(f"::error::Empty summary: {', '.join(bad)}. Refusing to "
                    f"publish a blank report over the last good one.")
              sys.exit(1)
          EOF

      - name: Compare the two arms
        env:
          # Read through the environment, not by splicing the expression into
          # the script. A boolean input is false when the box is unchecked and
          # null on a scheduled run; `inputs.x || 'true'` treats both as
          # truthy, which made the toggle impossible to turn off. Only the
          # literal string "true" enables the check here.
          EQUIV_CHECK: ${{ inputs.equiv_check }}
        run: |
          source .venv/bin/activate
          EQUIV_FLAG=""
          [ "$EQUIV_CHECK" = "true" ] && EQUIV_FLAG="--equiv-check"
          compare-results summary_datapath.json summary_verified.json -o report.html $EQUIV_FLAG
          compare-results summary_datapath.json summary_verified.json -o report.md $EQUIV_FLAG
          compare-results summary_datapath.json summary_verified.json -o report.json --format json

      - name: Post summary
        if: always()
        env:
          CIRCT_VERSION: ${{ needs.build_circt.outputs.circt_version }}
          BENCH_LABEL: ${{ needs.setup.outputs.bench_label }}
        run: |
          {
            echo "## Verified datapath vs CIRCT Datapath dialect"
            echo ""
            echo "| | Baseline | Verified |"
            echo "|---|---|---|"
            echo "| Lowering | Datapath dialect | Lean compressor trees |"
            echo "| circt-synth args | _(default)_ | \`--verified-datapath\` |"
            echo "| CIRCT | \`${CIRCT_VERSION}\` | \`${CIRCT_VERSION}\` |"
            echo "| Widths | \`${{ inputs.bitwidths || '8,16,32' }}\` | |"
            echo "| Suites | \`${BENCH_LABEL:-DatapathBench}\` | |"
            echo ""
            # Trailing `|| true`: this step runs on failure too, and a missing
            # report.md would otherwise make the step exit non-zero and mask
            # whatever actually went wrong.
            [ -f report.md ] && cat report.md || true
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-datapath-results
          retention-days: 30
          path: |
            report.html
            report.md
            report.json
            summary_datapath.json
            summary_verified.json

      - name: Assemble the site
        if: ${{ success() && (inputs.publish || github.event_name == 'schedule') }}
        run: |
          mkdir -p deploy
          cp report.html deploy/index.html
          cp report.json deploy/verified-datapath.json
          cp summary_datapath.json summary_verified.json deploy/
          [ -f cec.json ] && cp cec.json deploy/ || true

      - name: Configure Pages
        if: ${{ success() && (inputs.publish || github.event_name == 'schedule') }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ success() && (inputs.publish || github.event_name == 'schedule') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  # Pages deployment runs as its own job, which is what the "GitHub Actions"
  # Pages source expects.
  deploy:
    name: Publish report
    needs: report
    if: ${{ success() && (inputs.publish || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
